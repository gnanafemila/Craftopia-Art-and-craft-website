<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Craftopia</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <a href="index.html" class="logo">
                    <div class="logo-icon">C</div>
                    <span class="logo-text">Craftopia</span>
                </a>
                <div class="nav-links" id="navLinks">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="tutorials.html" class="nav-link">Tutorials</a>
                    <a href="events.html" class="nav-link">Events</a>
                    <a href="about.html" class="nav-link">About Us</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                </div>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <main style="min-height: calc(100vh - 300px); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
        <div style="max-width: 450px; width: 100%;">
            <div class="card">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #9333ea, #ec4899); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                        <i class="fas fa-user-plus" style="font-size: 2rem; color: white;"></i>
                    </div>
                    <h2 style="font-size: 1.875rem; font-weight: bold; color: white; margin-bottom: 0.5rem;">Create Account</h2>
                    <p style="color: #9ca3af;">Join the Craftopia community</p>
                </div>

                <form id="registerForm">
                    <div id="message" class="alert alert-error" style="display: none;"></div>

                    <div class="form-group">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-input" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div style="position: relative;">
                            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1.5rem;">
                        Create Account
                    </button>
                </form>

                <div style="margin-top: 1.5rem; text-align: center; color: #9ca3af;">
                    Already have an account? 
                    <a href="login.html" style="color: #a78bfa; text-decoration: none; font-weight: 500;">Login here</a>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="register.js"></script>
</body>
</html>
